<!doctype html><meta charset="utf-8"><style>@font-face{font-family:'Lilita One';src:url(/assets/lilita-one.woff2)}@font-face{font-family:DM;src:url(/assets/dm-sans-bold.ttf);font-weight:800}
html,body{margin:0;overflow:hidden}body{font-family:DM,sans-serif;color:#1d1a16}svg{display:block}
.og{width:1200px;height:630px;background:#fdf3df;display:grid;grid-template-columns:560px 1fr;align-items:center;gap:20px;padding:0 50px;box-sizing:border-box;position:relative;background-image:radial-gradient(rgba(29,26,22,.10) 1.6px,transparent 1.8px);background-size:18px 18px}
.og h1{font-family:'Lilita One';font-weight:400;font-size:64px;line-height:1;margin:18px 0 0}.og h1 span{display:block;color:#ef6339;-webkit-text-stroke:2.5px #1d1a16;paint-order:stroke fill;text-shadow:5px 5px 0 #1d1a16;margin-top:8px}
.chip{display:inline-block;background:#ffd23f;border:3px solid #1d1a16;border-radius:99px;padding:6px 16px;font-weight:800;font-size:18px;transform:rotate(-2deg);box-shadow:3px 3px 0 #1d1a16}
.foot{margin-top:24px;font-family:'Lilita One';font-size:28px;display:flex;gap:14px;align-items:center}.foot b{background:#1d1a16;color:#ffd23f;padding:4px 12px;border-radius:10px;font-weight:400}
.frame{border:4px solid #1d1a16;border-radius:26px;overflow:hidden;background:#fff;box-shadow:9px 9px 0 #1d1a16;transform:rotate(1.2deg)}
.banner{width:1500px;height:500px;background:#ffd23f;position:relative;overflow:hidden;background-image:radial-gradient(rgba(29,26,22,.13) 1.8px,transparent 2px);background-size:20px 20px}
.banner h1{position:absolute;left:90px;top:70px;margin:0;font-family:'Lilita One';font-weight:400;font-size:84px;line-height:1}.banner h1 span{color:#ef6339;-webkit-text-stroke:2.5px #1d1a16;paint-order:stroke fill;text-shadow:5px 5px 0 #1d1a16}
.banner p{position:absolute;left:94px;top:280px;margin:0;font-family:'Lilita One';font-size:34px}
.sq{background:#fdf3df;display:grid;place-items:center}
</style><div id=o></div><script type=module>
import * as A from '/art.js';const q=new URLSearchParams(location.search),k=q.get('k');await document.fonts.load("20px 'Lilita One'");await document.fonts.load("800 20px DM");
const sq=(n,inner,bg='#fdf3df')=>`<div class=sq style="width:${n}px;height:${n}px;background:${bg}"><div style="width:${n*.92}px">${inner}</div></div>`;
let h='';
if(k==='og')h=`<div class=og><div><span class=chip>EPISODE 1: THE 70% PROBLEM</span><h1>Your AI agent<br>quit at 70%.<span>Patch finishes<br>the job.</span></h1><div class=foot><b>$RELAY</b>relayworks.fun · @RelayWorksHQ</div></div><div class=frame>${A.heroScene()}</div></div>`;
if(k==='banner')h=`<div class=banner><div style="position:absolute;right:250px;top:50px;width:400px">${A.portrait("patch")}</div><h1>We finish what<br><span>your agent started.</span></h1><p>$RELAY · relayworks.fun</p><div style="position:absolute;right:20px;top:170px;width:280px;transform:rotate(8deg)">${A.portrait("gary")}</div></div>`;
if(k==='icon')h=sq(+q.get('n'),A.head('patch'),'#ef6339');
if(k==='avatar')h=sq(+q.get('n'),A.portrait('patch'),'#ffd23f');
if(k==='hero')h=`<div style="width:1280px">${A.heroScene()}</div>`;
if(k==='panel')h=`<div style="width:1200px">${A.panel(+q.get('n'))}</div>`;
if(k==='portrait')h=sq(800,A.portrait(q.get('n')));
if(k==='mood')h=sq(800,A.mood(q.get('n')));
o.outerHTML=h;</script>
