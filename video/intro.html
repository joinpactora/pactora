<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>RelayWorks Intro</title>
<meta name="viewport" content="width=1920">
<style>
@font-face{font-family:'Lilita One';src:url('../dist/assets/lilita-one.woff2') format('woff2')}
@font-face{font-family:DM;src:url('../dist/assets/dm-sans-regular.ttf') format('truetype');font-weight:400}
@font-face{font-family:DM;src:url('../dist/assets/dm-sans-bold.ttf') format('truetype');font-weight:700}
html,body{margin:0;background:#000;overflow:hidden}
#v{--acc:56,214,255;position:relative;width:1920px;height:1080px;overflow:hidden;background:#04060c;font-family:DM,Arial,sans-serif;color:#eef3ff;transform-origin:0 0}
canvas{position:absolute;left:0;top:0}
#stage{position:absolute;inset:0}
.L{position:absolute;inset:0;display:none;transform-origin:50% 50%}
.a{position:absolute}
.mono{font-family:Consolas,'Cascadia Mono','Courier New',monospace}
.disp{font-family:'Lilita One',DM,sans-serif;font-weight:400}
.acc{color:rgb(var(--acc))}
.panel{position:absolute;background:linear-gradient(180deg,rgba(18,28,48,.78),rgba(6,10,20,.84));border:1.5px solid rgba(var(--acc),.42);border-radius:20px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 30px 90px rgba(0,0,0,.55),0 0 60px rgba(var(--acc),.12);overflow:hidden}
.panel::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 2px,transparent 2px 4px);pointer-events:none}
.ph{position:absolute;left:32px;top:24px;right:32px;display:flex;align-items:center;gap:18px;font-size:22px;letter-spacing:.14em;color:#9fb0c8}
.chip{display:inline-flex;align-items:center;gap:10px;padding:6px 14px;border-radius:999px;font-size:18px;letter-spacing:.14em;border:1.5px solid currentColor;font-family:Consolas,monospace}
.chip i{width:10px;height:10px;border-radius:50%;background:currentColor;display:inline-block}
.grid{position:absolute;display:grid;grid-template-columns:repeat(10,var(--c));gap:var(--g)}
.cell{width:var(--c);height:var(--c);border-radius:7px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08);box-sizing:border-box}
.cell.d{background:rgba(95,240,192,.78);border-color:#9ff0d0;box-shadow:0 0 12px rgba(95,240,192,.45)}
.cell.s{background:rgba(95,240,192,.9);border:2px solid #eafff6;box-shadow:0 0 18px rgba(95,240,192,.8)}
.cell.f{background:#ff3355;border-color:#ff9aab;box-shadow:0 0 26px #ff3355}
.cell.p{background:#ef6339;border-color:#ffb08f;box-shadow:0 0 16px rgba(239,99,57,.7)}
.cell.w{background:#fff;border-color:#fff;box-shadow:0 0 30px #ffb08f}
.cell.g{background:rgba(120,120,140,.18);border-color:rgba(255,255,255,.1)}
.bub{z-index:6;position:absolute;background:#fff;color:#1d1a16;border:5px solid #1d1a16;border-radius:38px;padding:20px 38px 24px;font-family:'Lilita One';font-size:56px;line-height:1.05;box-shadow:7px 7px 0 #1d1a16;white-space:nowrap;transform-origin:10% 100%}
.bub::before{content:'';position:absolute;left:46px;bottom:-34px;border:18px solid transparent;border-top:18px solid #1d1a16;border-left:18px solid #1d1a16}
.bub::after{content:'';position:absolute;left:52px;bottom:-21px;border:12px solid transparent;border-top:12px solid #fff;border-left:12px solid #fff}
.cap{position:absolute;left:0;right:0;top:852px;text-align:center}
.cap .k{font-family:Consolas,monospace;font-size:22px;letter-spacing:.34em;color:rgb(var(--acc));margin-bottom:14px;text-shadow:0 0 18px rgba(var(--acc),.6)}
.cap .t{font-family:'Lilita One';font-size:60px;line-height:1.05;color:#fff;text-shadow:0 4px 30px rgba(0,0,0,.9),0 0 2px #000}
.w{display:inline-block;white-space:pre}
.log{position:absolute;font-family:Consolas,monospace;font-size:21px;line-height:1.62;color:#9fb0c8;white-space:pre}
.ring{position:absolute;border-radius:50%;border:3px solid rgba(var(--acc),.7);box-shadow:0 0 30px rgba(var(--acc),.5),inset 0 0 30px rgba(var(--acc),.35)}
.stamp{position:absolute;font-family:'Lilita One';color:#ff3355;border:10px solid #ff3355;border-radius:24px;padding:10px 40px;text-shadow:0 0 30px rgba(255,51,85,.8);box-shadow:0 0 50px rgba(255,51,85,.5),inset 0 0 30px rgba(255,51,85,.3);white-space:nowrap;background:rgba(20,0,6,.55)}
.hud{position:absolute;font-family:Consolas,monospace;font-size:20px;letter-spacing:.22em;color:rgba(220,235,255,.75)}
.br{position:absolute;width:46px;height:46px;border-color:rgba(var(--acc),.75);border-style:solid;border-width:0}
.node{position:absolute;width:72px;height:72px;margin:-36px 0 0 -36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Lilita One';font-size:32px;border:3px solid rgba(255,255,255,.25);background:#0a1120;color:#7d8aa3;box-sizing:border-box}
.nlab{position:absolute;width:240px;margin-left:-120px;text-align:center;font-family:Consolas,monospace;font-size:19px;letter-spacing:.2em;color:#7d8aa3}
.step{position:absolute;left:140px;top:330px;width:820px}
.step .n{font-family:'Lilita One';font-size:130px;line-height:1;color:transparent;-webkit-text-stroke:3px rgb(var(--acc));opacity:.9}
.step .h{font-family:'Lilita One';font-size:84px;line-height:1.02;margin-top:6px;color:#fff}
.step .p{font-size:36px;line-height:1.38;color:#b9c6dc;margin-top:26px}
.sub{position:absolute;inset:0}
.btn{position:absolute;border-radius:14px;font-family:'Lilita One';font-size:34px;display:flex;align-items:center;justify-content:center}
.tick{display:inline-flex;width:40px;height:40px;border-radius:50%;align-items:center;justify-content:center;border:2.5px solid rgba(255,255,255,.25);margin-right:18px;font-size:24px;font-weight:700;vertical-align:middle;box-sizing:border-box}
.ci{height:66px;display:flex;align-items:center;font-size:27px;color:#c9d4e6}
.headc{position:absolute;width:108px;height:108px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#1d2a44,#0b1222);border:3px solid rgba(255,255,255,.2);overflow:hidden;box-sizing:border-box}
.headc svg{width:100%;height:100%}
.coin{position:absolute;width:44px;height:44px;margin:-22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#bfe3ff,#2775ca 60%,#174a87);border:2px solid #d9ecff;box-shadow:0 0 20px rgba(80,160,255,.8);color:#fff;font:700 24px DM;display:flex;align-items:center;justify-content:center}
.stat{position:absolute;width:330px}
.stat .v{font-family:'Lilita One';font-size:104px;line-height:1;color:#fff}
.stat .l{font-family:Consolas,monospace;font-size:20px;letter-spacing:.2em;color:#9fb0c8;margin-top:8px}
</style></head>
<body>
<div id="v">
 <canvas id="bg" width="1920" height="1080"></canvas>
 <div id="stage"></div>
 <div id="caps"><div class="cap" id="cap"><div class="k" id="capk"></div><div class="t" id="capt"></div></div></div>
 <div id="hudL" class="L" style="display:block"></div>
 <canvas id="fx" width="1920" height="1080"></canvas>
 <div id="flash" class="a" style="inset:0;background:#fff;opacity:0"></div>
 <div id="black" class="a" style="inset:0;background:#000;opacity:1"></div>
</div>
<script type="module">
import {C,garyBot,patchBot,atlasBot,menderBot,restartVillain,head,bot} from '../dist/art.js';
const W=1920,H=1080,FPS=30,DUR=90;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const eo=x=>1-Math.pow(1-x,3), eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eback=x=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const fade=(t,a,b,c,d)=>Math.min(seg(t,a,b),1-seg(t,c,d));
const rnd=n=>{const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};
const lerp=(a,b,p)=>a+(b-a)*p;
const pad=(n,l=3)=>String(n).padStart(l,'0');
const $=id=>document.getElementById(id);
const V=$('v'),stage=$('stage');
const svg=(body,vb='0 0 200 240')=>`<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;overflow:visible;display:block">${body}</svg>`;
function mk(parent,html,style='',cls='a'){const d=document.createElement('div');d.className=cls;if(style)d.style.cssText=style;d.innerHTML=html;parent.appendChild(d);return d}
function layer(){const d=document.createElement('div');d.className='L';stage.appendChild(d);return d}
const set=(el,o,tf)=>{el.style.opacity=o;if(tf!==undefined)el.style.transform=tf};
const typed=(s,t,a,cps=40)=>s.slice(0,Math.max(0,Math.floor((t-a)*cps)));
function mkWords(el,text){el.innerHTML='';return text.split(' ').map(w=>{const s=document.createElement('span');s.className='w';s.textContent=w+' ';el.appendChild(s);return s})}
function showWords(sp,p){const n=sp.length;sp.forEach((s,i)=>{const q=clamp(p*(n+2)-i,0,2)/2;s.style.opacity=q;s.style.transform=`translateY(${(1-eo(q))*34}px)`;s.style.filter=q<1?`blur(${(1-q)*8}px)`:'none'})}
function mkGrid(parent,x,y,c,g){const d=mk(parent,'',`left:${x}px;top:${y}px;--c:${c}px;--g:${g}px`,'grid');const cells=[];for(let i=0;i<100;i++){const e=document.createElement('div');e.className='cell';d.appendChild(e);cells.push(e)}return {d,cells}}
function setGrid(G,fn){G.cells.forEach((c,i)=>{const k='cell'+(fn(i)?' '+fn(i):'');if(c.className!==k)c.className=k})}
function bubble(parent,x,y,text,size=56){return mk(parent,text,`left:${x}px;top:${y}px;font-size:${size}px;opacity:0`,'bub')}
function pop(el,t,a,b){const o=fade(t,a,a+.18,b-.2,b);const s=t<a+.4?eback(seg(t,a,a+.4)):1;set(el,o,`scale(${lerp(.3,1,s)})`)}

/* ---------- mood colour ---------- */
const MOOD=[[0,[56,214,255]],[19.9,[56,214,255]],[20.2,[255,51,85]],[29.6,[255,51,85]],[30.4,[168,85,255]],[36.8,[200,60,255]],[37.5,[255,40,60]],[38,[239,99,57]],[45.6,[239,99,57]],[46.4,[95,240,192]],[75.6,[95,240,192]],[76.4,[239,99,57]],[90,[239,99,57]]];
function mood(t){for(let i=0;i<MOOD.length-1;i++){const [a,ca]=MOOD[i],[b,cb]=MOOD[i+1];if(t<=b){const p=seg(t,a,b);return ca.map((v,j)=>Math.round(lerp(v,cb[j],p)))}}return MOOD.at(-1)[1]}

/* ---------- glitch envelope ---------- */
const GL=[[20.02,20.95,.75],[23.3,24.4,1],[29.55,30.15,.55],[37.25,37.62,.9],[40.5,41.05,.7]];
function glitch(t){let g=0;for(const [a,b,k] of GL){if(t>=a&&t<=b){const p=seg(t,a,b);g=Math.max(g,k*Math.sin(p*Math.PI)*(.55+.45*rnd(Math.floor(t*30)*3.1)))}}return g}

/* ---------- background canvas ---------- */
const bg=$('bg').getContext('2d');
const HEX='0123456789abcdef';
function drawBG(t,c){
 const [r,g,b]=c;bg.fillStyle='#04060c';bg.fillRect(0,0,W,H);
 const rg=bg.createRadialGradient(960,470,40,960,520,1100);rg.addColorStop(0,`rgba(${r},${g},${b},.16)`);rg.addColorStop(.5,`rgba(${r},${g},${b},.05)`);rg.addColorStop(1,'rgba(0,0,0,0)');bg.fillStyle=rg;bg.fillRect(0,0,W,H);
 // data rain
 bg.font='18px Consolas,monospace';
 for(let i=0;i<48;i++){const x=20+i*40+rnd(i)*14,sp=40+rnd(i+9)*90,len=8+Math.floor(rnd(i+3)*14),y0=((t*sp+rnd(i+7)*1400)%1500)-300;
  for(let j=0;j<len;j++){const y=y0-j*22;if(y<-20||y>H)continue;const a=(1-j/len)*.11*(j===0?2.2:1);bg.fillStyle=`rgba(${r},${g},${b},${a})`;bg.fillText(HEX[Math.floor(rnd(i*31+j+Math.floor(t*6+j))*16)],x,y)}}
 // perspective floor
 const hz=640;bg.save();bg.beginPath();bg.rect(0,hz,W,H-hz);bg.clip();
 const fl=bg.createLinearGradient(0,hz,0,H);fl.addColorStop(0,'rgba(4,6,12,1)');fl.addColorStop(1,`rgba(${r*.08|0},${g*.08|0},${b*.08|0},1)`);bg.fillStyle=fl;bg.fillRect(0,hz,W,H-hz);
 bg.lineWidth=1.4;
 for(let i=-24;i<=24;i++){const gr=bg.createLinearGradient(0,hz,0,H);gr.addColorStop(0,`rgba(${r},${g},${b},0)`);gr.addColorStop(1,`rgba(${r},${g},${b},.32)`);bg.strokeStyle=gr;bg.beginPath();bg.moveTo(960+i*34,hz);bg.lineTo(960+i*330,H);bg.stroke()}
 const off=(t*.55)%1;for(let k=0;k<16;k++){const d=(k+off)/16,y=hz+(H-hz)*d*d;bg.strokeStyle=`rgba(${r},${g},${b},${.32*d})`;bg.beginPath();bg.moveTo(0,y);bg.lineTo(W,y);bg.stroke()}
 bg.restore();
 const hl=bg.createLinearGradient(0,hz-60,0,hz+40);hl.addColorStop(0,'rgba(0,0,0,0)');hl.addColorStop(.6,`rgba(${r},${g},${b},.22)`);hl.addColorStop(1,'rgba(0,0,0,0)');bg.fillStyle=hl;bg.fillRect(0,hz-60,W,100);
 // particles
 for(let i=0;i<110;i++){const x=(rnd(i)*W+Math.sin(t*.3+i)*30),y=H-((t*(12+rnd(i+1)*40)+rnd(i+2)*H)%(H+40)),s=1+rnd(i+4)*2.6,a=.15+.5*rnd(i+5)*(.6+.4*Math.sin(t*2+i));bg.fillStyle=`rgba(${r},${g},${b},${a})`;bg.beginPath();bg.arc(x,y,s,0,7);bg.fill()}
}

/* ---------- fx canvas ---------- */
const fx=$('fx').getContext('2d');
const vig=document.createElement('canvas');vig.width=W;vig.height=H;{const v=vig.getContext('2d');const gr=v.createRadialGradient(960,540,420,960,540,1180);gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,.78)');v.fillStyle=gr;v.fillRect(0,0,W,H);v.fillStyle='rgba(0,0,0,.16)';for(let y=0;y<H;y+=3)v.fillRect(0,y,W,1)}
const grains=[0,1,2,3].map(k=>{const c=document.createElement('canvas');c.width=480;c.height=270;const x=c.getContext('2d'),id=x.createImageData(480,270);for(let i=0;i<id.data.length;i+=4){const v=rnd(i*.37+k*999)*255;id.data[i]=id.data[i+1]=id.data[i+2]=v;id.data[i+3]=22}x.putImageData(id,0,0);return c});
function drawFX(t,g,c){
 fx.clearRect(0,0,W,H);fx.drawImage(vig,0,0);
 fx.globalCompositeOperation='overlay';fx.drawImage(grains[Math.floor(t*30)%4],0,0,W,H);fx.globalCompositeOperation='source-over';
 if(g>.04){const f=Math.floor(t*30);for(let i=0;i<Math.floor(6+g*16);i++){const y=rnd(f*13+i)*H,h=4+rnd(f*7+i)*60*g,x=(rnd(f*5+i)-.5)*300*g;fx.fillStyle=i%3===0?`rgba(255,40,80,${.35*g})`:i%3===1?`rgba(0,240,255,${.3*g})`:`rgba(255,255,255,${.12*g})`;fx.fillRect(x,y,W,h)}
  for(let i=0;i<Math.floor(g*10);i++){fx.fillStyle=`rgba(${c[0]},${c[1]},${c[2]},${.5*g})`;fx.fillRect(rnd(f*3+i*9)*W,rnd(f*11+i*5)*H,20+rnd(f+i)*180,6+rnd(f*2+i)*26)}}
}

/* ---------- HUD ---------- */
const hud=$('hudL');
const brs=[['left:40px;top:40px','border-left-width:3px;border-top-width:3px'],['right:40px;top:40px','border-right-width:3px;border-top-width:3px'],['left:40px;bottom:40px','border-left-width:3px;border-bottom-width:3px'],['right:40px;bottom:40px','border-right-width:3px;border-bottom-width:3px']].map(([p,b])=>mk(hud,'',`${p};${b}`,'br'));
const hudTL=mk(hud,`<span style="display:inline-flex;align-items:center;gap:14px"><img src="../dist/assets/mark.svg" style="width:34px;height:34px"> RELAYWORKS <span id="live" style="color:#ff5a3c">● LIVE</span></span>`,'left:72px;top:64px','hud');
const hudTR=mk(hud,'','right:72px;top:68px;text-align:right','hud');
const hudBL=mk(hud,'','left:72px;bottom:66px','hud');
const hudBR=mk(hud,'','right:72px;bottom:66px;text-align:right','hud');
function updHUD(t){
 const o=fade(t,.9,1.8,89,89.8)*(t>37.6&&t<38.15?0:1);hud.style.opacity=o;
 $('live').style.opacity=.45+.55*(Math.sin(t*5)>0?1:.3);
 const s=Math.floor(t)+14*60+11,cs=Math.floor((t%1)*100);
 hudTR.textContent=`NODE 07 · 03:${pad(Math.floor(s/60)%60,2)}:${pad(s%60,2)}.${pad(cs,2)}`;
 const ch=t<7.5?'BOOT SEQUENCE':t<20?'CH.01 · THE NIGHT SHIFT':t<30?'CH.02 · ROW 71':t<38?'CH.03 · THE USUAL FIX':t<46?'RELAYWORKS':t<76?'CH.04 · THE RESCUE':t<83?'CH.05 · THE ENDING':'RELAYWORKS.FUN';
 hudBL.textContent='▸ '+ch;
 hudBR.textContent=`SIG ${(92+Math.sin(t*1.7)*5).toFixed(1)}% · LAT ${(18+Math.sin(t*3.1)*4).toFixed(0)}MS`;
}

/* ---------- captions ---------- */
const CAPS=[
 [8.3,15.1,'CHAPTER 01 · THE NIGHT SHIFT','This is Gary. Gary had one job:<br>enrich 100 customer rows.'],
 [15.3,19.85,'CHAPTER 01 · THE NIGHT SHIFT','Coffee in hand. Vibes immaculate.'],
 [20.7,24.9,'CHAPTER 02 · ROW 71','Then came row 71.<br>The country field said "??"'],
 [25.1,29.4,'CHAPTER 02 · ROW 71','Gary said "brb."<br>He was never seen again.'],
 [30.9,37.2,'CHAPTER 03 · THE USUAL FIX','Press restart. Throw away 70 good rows.<br>Pay for all 100 again.'],
 [76.7,80.3,'CHAPTER 05 · THE ENDING','100 out of 100.<br>Gary\'s 70 rows, kept.'],
 [80.5,82.85,'CHAPTER 05 · THE ENDING','Gary\'s fine. He starts a new job tomorrow.']
].map(([a,b,k,txt])=>({a,b,k,txt}));
const capEl=$('cap'),capk=$('capk'),capt=$('capt');let capCur=null,capSp=[];
function mkCapWords(html){capt.innerHTML='';const sp=[];html.split('<br>').forEach((line,li)=>{if(li)capt.appendChild(document.createElement('br'));line.split(' ').forEach(w=>{const s=document.createElement('span');s.className='w';s.textContent=w+' ';capt.appendChild(s);sp.push(s)})});return sp}
function updCaps(t){const c=CAPS.find(c=>t>=c.a&&t<=c.b);if(!c){capEl.style.opacity=0;return}
 if(capCur!==c){capCur=c;capSp=mkCapWords(c.txt)}
 capEl.style.opacity=1-seg(t,c.b-.35,c.b);capk.textContent=typed(c.k,t,c.a,60)+(Math.floor(t*4)%2?'_':' ');
 showWords(capSp,seg(t,c.a+.15,c.a+.25+capSp.length*.07))}

/* ================= SCENES ================= */
const scenes=[];
function scene(a,b,build,upd){const L=layer();const s={a,b,L,st:build(L)};s.upd=t=>upd(t,s.st,L);scenes.push(s);return s}

/* --- 1. BOOT 0–7.5 --- */
scene(0,7.6,L=>{
 const line=mk(L,'','left:0;top:539px;width:1920px;height:2px;background:#bff4ff;box-shadow:0 0 30px #38d6ff');
 const term=mk(L,'','left:150px;top:170px;font-size:27px;line-height:1.7;color:#7fe3ff','log');
 const t1=mk(L,'','left:0;right:0;top:420px;text-align:center;font-size:104px;color:#fff;text-shadow:0 0 40px rgba(56,214,255,.5)','a disp');
 const t2=mk(L,'','left:0;right:0;top:560px;text-align:center;font-size:104px;color:rgb(56,214,255);text-shadow:0 0 50px rgba(56,214,255,.8)','a disp');
 return {line,term,t1,sp1:mkWords(t1,'Every night, AI agents clock in.'),t2,sp2:mkWords(t2,'Not all of them clock out.')};
},(t,s)=>{
 const lp=seg(t,.15,.75);set(s.line,(1-seg(t,.7,1.1)),`scaleX(${eo(lp)}) scaleY(${1+seg(t,.7,1.1)*40})`);
 const L1=[[1.0,'> relayworks://night-shift --watch'],[1.7,'> agents online ........ 2,481,904'],[2.4,'> job RW-024 · enrich_customers.csv'],[3.1,'> status ............... RUNNING ▮']];
 s.term.textContent=L1.map(([a,x])=>typed(x,t,a,55)).filter(Boolean).join('\n');s.term.style.opacity=1-seg(t,6.8,7.4);
 showWords(s.sp1,seg(t,3.7,4.5));showWords(s.sp2,seg(t,5.2,5.9));
 const o=1-seg(t,6.9,7.5);s.t1.style.opacity=o;s.t2.style.opacity=o;s.t1.style.transform=s.t2.style.transform=`scale(${1+seg(t,3.7,7.5)*.06})`;
});

/* --- 2+3. OFFICE / CRASH 7.5–30 --- */
